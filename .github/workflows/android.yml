name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of the release signing certificate. Every release must match it, so installed apps can update.
  RELEASE_CERT_SHA256: EEAE07167519A0984865491B8F669DF8991DBA3565D5FC720C7E45539E764D3B

# Third-party actions are pinned to reviewed commits (version in the trailing comment).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web app and sync into Android project
        run: npm run android:sync

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi

      # Ordinary pushes and pull requests: compile check only, no signing secrets, no artifact.
      - name: Build debug APK (check only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Version tags only: signed release APK.
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are missing; refusing to build a release."; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove keystore
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify release signature and version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          FOUND=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print toupper($NF)}')
          if [ "$FOUND" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::APK is not signed with the release key (found $FOUND)"; exit 1
          fi
          BADGING=$("$BT/aapt" dump badging "$APK" | head -1)
          echo "$BADGING"
          VERSION=${{ steps.version.outputs.version }}
          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$((MA * 10000 + MI * 100 + PA))
          [[ "$BADGING" == *"name='com.asifbinmahmood.messledger'"* && "$BADGING" == *"versionCode='$CODE'"* && "$BADGING" == *"versionName='$VERSION'"* ]] \
            || { echo "::error::APK identity/version mismatch"; exit 1; }
          mkdir -p dist-apk
          cp "$APK" "dist-apk/mess-ledger-v$VERSION.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: mess-ledger-apk-${{ steps.version.outputs.version }}
          path: dist-apk/*.apk
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse to modify an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; published releases are never modified."; exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: apk
          merge-multiple: true

      - name: Refuse anything but the signed release APK
        run: |
          ls -la apk
          [ "$(ls apk)" = "mess-ledger-${GITHUB_REF_NAME}.apk" ] || { echo "::error::Unexpected release files"; exit 1; }

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: apk/mess-ledger-${{ github.ref_name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: false
          prerelease: false
          make_latest: true
