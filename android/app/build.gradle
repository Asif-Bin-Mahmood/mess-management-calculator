apply plugin: 'com.android.application'

// Version comes from package.json (single source of truth): versionName = "x.y.z",
// versionCode = x*10000 + y*100 + z, which only increases as the version increases.
def appPackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def versionParts = appPackage.version.tokenize('.').collect { it.replaceAll(/[^0-9].*$/, '').toInteger() }
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// Release signing. Values come from environment variables (GitHub Actions secrets) or from
// android/keystore.properties (local only, gitignored). The keystore itself always lives outside the repo.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) signingPropsFile.withInputStream { signingProps.load(it) }
def signingValue = { String prop, String env -> System.getenv(env) ?: signingProps.getProperty(prop) }
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
def hasReleaseSigning = releaseStoreFile && signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD') &&
        signingValue('keyAlias', 'ANDROID_KEY_ALIAS') && signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')

android {
    namespace = "com.asifbinmahmood.messledger"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.asifbinmahmood.messledger"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Without signing credentials the release APK is left unsigned; it is never published that way.
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
